<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --purple: #d4d6e0;
            --purple-dark: #7f9cf5;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- CARD -->
    <div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-md">

        <!-- TITLE -->
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
            Login to Your Account
        </h1>

        <!-- FORM -->
        <form action="/JAD_Assign1/login/checkPassword.jsp" method="post">



            <!-- USERNAME -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Username</label>
                <input name="username" type="text" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[var(--purple-dark)] focus:border-[var(--purple-dark)] outline-none" />
            </div>

            <!-- PASSWORD -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input name="password" type="password" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[var(--purple-dark)] focus:border-[var(--purple-dark)] outline-none" />
            </div>

            <!-- BUTTONS -->
            <div class="flex flex-col gap-3 mt-8">

                <!-- LOGIN BTN -->
                <button type="submit"
                    class="w-full bg-[var(--purple-dark)] text-white py-2 font-semibold rounded-lg
                           hover:bg-indigo-500 transition">
                    Login
                </button>

	             <!-- SIGN UP BTN -->
				<button type="button"
				    onclick="window.location.href='signUp.jsp';"
				    class="w-full bg-gray-200 text-gray-700 py-2 font-semibold rounded-lg
				           hover:bg-gray-300 transition">
				    Sign Up
				</button>
				
				<!-- CONTINUE AS GUEST -->
				<button type="button"
				    onclick="window.location.href='guestLogin.jsp';"
				    class="btn guest-btn">
				    Continue as Guest
				</button>
                

            </div>
        </form>

        <!-- OPTIONAL FOOTER TEXT -->
        <p class="text-center text-gray-500 text-sm mt-6">
            Don’t have an account yet? 
            <a href="signUp.html" class="text-[var(--purple-dark)] font-semibold hover:underline">
                Create one
            </a>
        </p>

    </div>

</body>
</html>
