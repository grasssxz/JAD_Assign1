<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8">

        <h1 class="text-3xl font-bold text-center mb-6 text-purple-700">
            Create Your Account
        </h1>

        <form action="/JAD_Assign1/login/signUp.jsp" method="post">



            <!-- USERNAME -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Username</label>
                <input 
                    name="username" 
                    type="text" 
                    required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
                >
            </div>

            <!-- PASSWORD -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input 
                    name="password" 
                    type="password" 
                    required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
                >
            </div>

            <!-- EMAIL -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Email</label>
                <input 
                    name="email" 
                    type="email" 
                    required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"
                >
            </div>

            <!-- BUTTONS -->
            <div class="flex gap-3 mt-6">

                <button 
                    type="submit" 
                    class="flex-1 bg-purple-600 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition">
                    Sign Up
                </button>

                <button 
                    type="button" 
                    onclick="window.location.href='login.html'" 
                    class="flex-1 border border-purple-500 text-purple-600 font-semibold py-3 rounded-lg hover:bg-purple-50 transition">
                    Back to Login
                </button>

            </div>

        </form>
    </div>

</body>
</html>
